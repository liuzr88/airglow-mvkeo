[project]
name = "airglow-mvkeo"
version = "0.1.0"
description = "Keogram & movie generator for ALO airglow NetCDF data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "xarray>=2024.1",
    "netcdf4>=1.6",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "imageio-ffmpeg>=0.6",
    "tqdm>=4.66",
]

[project.scripts]
airglow-mvkeo = "airglow_mvkeo.cli:main"
airglow-fits-to-nc = "airglow_mvkeo.fits_to_nc:main"
airglow-fits-to-nc-batch = "airglow_mvkeo.fits_to_nc_batch:main"
airglow-convert-missing = "airglow_mvkeo.fits_to_nc_batch:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airglow_mvkeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["visual: visual regression tests (requires reference fixtures)"]
